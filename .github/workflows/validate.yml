name: Validate synthetic examples
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_examples.py examples/synthetic_examples.jsonl
      - run: python -m unittest discover -s tests -v
